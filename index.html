<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>AF — كتالوج المستودعات</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap');
:root{
  --gold:#c9a84c;--dark:#111827;--card:#1f2937;
  --border:rgba(201,168,76,0.18);--text:#f1f5f9;--muted:#64748b;
  --green:#22c55e;--yellow:#eab308;--red:#ef4444;--blue:#3b82f6;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:'Cairo',sans-serif;background:var(--dark);color:var(--text);height:100vh;display:flex;flex-direction:column;overflow:hidden}

.header{background:linear-gradient(180deg,#1e3a5f,#111827);border-bottom:2px solid var(--gold);padding:12px 16px;flex-shrink:0;box-shadow:0 4px 24px rgba(0,0,0,.5)}
.h-top{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.logo{font-size:20px;font-weight:900;color:var(--gold);letter-spacing:3px}
.logo em{color:#fff;font-style:normal;font-weight:400;font-size:13px;margin-right:4px}
.pills{display:flex;gap:6px;margin-right:auto}
.pill{font-size:11px;padding:3px 10px;border-radius:20px;font-weight:700;white-space:nowrap}
.p1{background:rgba(59,130,246,.2);color:#60a5fa;border:1px solid rgba(59,130,246,.3)}
.p2{background:rgba(201,168,76,.15);color:var(--gold);border:1px solid var(--border)}
.p3{background:rgba(34,197,94,.15);color:#4ade80;border:1px solid rgba(34,197,94,.25)}
.sw{position:relative}
.si{width:100%;padding:11px 44px 11px 14px;background:#0f172a;border:1.5px solid var(--border);border-radius:10px;color:#fff;font-family:'Cairo',sans-serif;font-size:15px;outline:none;transition:border-color .2s}
.si:focus{border-color:var(--gold)}
.si::placeholder{color:var(--muted)}
.sic{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:17px;pointer-events:none}
.sc{position:absolute;right:12px;top:50%;transform:translateY(-50%);background:none;border:none;color:var(--muted);font-size:20px;cursor:pointer;display:none;line-height:1;padding:0}

.filters{display:flex;gap:6px;padding:8px 16px;overflow-x:auto;background:rgba(15,23,42,.5);border-bottom:1px solid var(--border);flex-shrink:0;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.fb{padding:5px 14px;border-radius:20px;border:1px solid var(--border);background:transparent;color:var(--muted);font-family:'Cairo',sans-serif;font-size:12px;cursor:pointer;white-space:nowrap;transition:all .15s;flex-shrink:0}
.fb.on{background:var(--gold);color:#111;border-color:var(--gold);font-weight:700}

.rbar{padding:7px 16px;font-size:12px;color:var(--muted);background:rgba(0,0,0,.2);border-bottom:1px solid var(--border);flex-shrink:0;display:flex;align-items:center;gap:8px}
.rbar strong{color:var(--gold)}
.sort-btn{margin-right:auto;background:none;border:1px solid var(--border);color:var(--muted);font-family:'Cairo',sans-serif;font-size:11px;padding:3px 10px;border-radius:6px;cursor:pointer;transition:color .2s}

.gw{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;padding:12px}
@media(min-width:600px){.grid{grid-template-columns:repeat(3,1fr)}}
@media(min-width:900px){.grid{grid-template-columns:repeat(4,1fr)}}
@media(min-width:1200px){.grid{grid-template-columns:repeat(5,1fr)}}

.card{background:var(--card);border:1px solid var(--border);border-radius:12px;overflow:hidden;cursor:pointer;transition:transform .15s,box-shadow .15s,border-color .15s}
.card:active{transform:scale(.97)}
.card.hi{border-color:var(--gold);box-shadow:0 4px 20px rgba(201,168,76,.15)}
.iw{position:relative;aspect-ratio:1;overflow:hidden;background:linear-gradient(135deg,#1e293b,#0f172a)}
.ci{width:100%;height:100%;object-fit:cover}
.ni{width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:32px;color:rgba(255,255,255,.08)}
.wb{position:absolute;top:6px;right:6px;font-size:10px;font-weight:700;padding:2px 7px;border-radius:6px}
.w1b{background:rgba(59,130,246,.85);color:#fff}
.w2b{background:rgba(201,168,76,.85);color:#111}
.w3b{background:rgba(34,197,94,.85);color:#111}
.cb{padding:8px 10px 10px}
.pkg{display:inline-block;background:rgba(201,168,76,.12);color:var(--gold);font-size:10px;font-weight:700;padding:2px 7px;border-radius:5px;margin-bottom:5px}
.cn{font-size:12px;font-weight:600;line-height:1.45;margin-bottom:6px;display:-webkit-box;-webkit-line-clamp:2;line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

/* Box quantity display on card */
.qty-row{display:flex;align-items:stretch;gap:6px;margin-bottom:0}
.qty-box{flex:1;background:rgba(0,0,0,.2);border-radius:7px;padding:5px 7px;text-align:center;border:1px solid rgba(255,255,255,.05)}
.qty-label{font-size:9px;color:var(--muted);display:block;margin-bottom:1px}
.qty-val{font-size:14px;font-weight:700;display:block;line-height:1.2}
.qty-unit{font-size:9px;font-weight:400}

/* MODAL */
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.88);z-index:300;align-items:flex-end;justify-content:center}
.overlay.on{display:flex}
.modal{background:#1e293b;border:1px solid var(--gold);border-radius:20px 20px 0 0;width:100%;max-width:560px;max-height:88vh;overflow-y:auto;padding:20px;animation:up .28s ease}
@keyframes up{from{transform:translateY(100%)}to{transform:translateY(0)}}
.mcl{float:left;background:rgba(255,255,255,.08);border:none;color:var(--muted);font-size:20px;cursor:pointer;width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center}
.mimg{width:100%;border-radius:12px;margin:12px 0;display:none}
.mcode{display:inline-block;background:rgba(201,168,76,.15);color:var(--gold);font-size:12px;font-weight:700;padding:3px 10px;border-radius:7px;margin:8px 0 4px}
.mname{font-size:17px;font-weight:700;line-height:1.4;margin-bottom:16px}

/* Modal qty grid - hero display */
.mqty{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
.mqty-main{grid-column:1/-1;background:linear-gradient(135deg,rgba(201,168,76,.12),rgba(201,168,76,.05));border:1px solid rgba(201,168,76,.3);border-radius:12px;padding:16px;text-align:center}
.mqty-main .big{font-size:36px;font-weight:900;line-height:1}
.mqty-main .unit{font-size:13px;color:var(--muted);margin-top:4px}
.mqty-sub{background:rgba(255,255,255,.04);border:1px solid var(--border);border-radius:10px;padding:12px;text-align:center}
.mqty-sub .num{font-size:20px;font-weight:700;color:var(--gold)}
.mqty-sub .lbl{font-size:11px;color:var(--muted);margin-top:2px}

.mdetails{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mi2{background:rgba(255,255,255,.04);border:1px solid var(--border);border-radius:10px;padding:10px 12px}
.ml{font-size:10px;color:var(--muted);margin-bottom:3px}
.mv{font-size:14px;font-weight:700;color:var(--gold)}
.mfull{grid-column:1/-1}

.empty{grid-column:1/-1;text-align:center;padding:60px 20px;color:var(--muted)}
.lmw{grid-column:1/-1;text-align:center;padding:16px 0 24px}
.lmb{background:var(--gold);color:#111;border:none;padding:12px 36px;border-radius:10px;font-family:'Cairo',sans-serif;font-size:14px;font-weight:700;cursor:pointer}

/* ===== added: edit / add-image / add-product / export ===== */
.addimg-btn{position:absolute;bottom:6px;left:6px;right:6px;background:rgba(0,0,0,.68);color:#fff;border:1px dashed rgba(255,255,255,.4);border-radius:7px;font-size:10px;padding:5px 2px;cursor:pointer;font-family:'Cairo',sans-serif}
.addimg-btn:hover{background:rgba(0,0,0,.85);border-color:var(--gold);color:var(--gold)}

.fab-bar{position:fixed;bottom:18px;left:18px;display:flex;flex-direction:column;gap:10px;z-index:250}
.fab{width:52px;height:52px;border-radius:50%;border:none;font-size:21px;cursor:pointer;box-shadow:0 4px 18px rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center}
.fab.add{background:var(--gold);color:#111}
.fab.exp{background:#1e293b;color:var(--gold);border:1.5px solid var(--gold)}

.medit{float:left;margin-left:8px;background:rgba(201,168,76,.15);border:1px solid var(--gold);color:var(--gold);font-size:12px;font-weight:700;padding:8px 14px;border-radius:20px;cursor:pointer;font-family:'Cairo',sans-serif}

.fmodal{background:#1e293b;border:1px solid var(--gold);border-radius:16px;width:100%;max-width:480px;max-height:90vh;overflow-y:auto;padding:20px;margin:5vh auto;animation:up .28s ease}
.ftitle{font-size:16px;font-weight:700;color:var(--gold);margin-bottom:14px}
.frow{margin-bottom:10px}
.frow label{display:block;font-size:11px;color:var(--muted);margin-bottom:4px}
.frow input,.frow select{width:100%;padding:9px 10px;background:#0f172a;border:1.5px solid var(--border);border-radius:8px;color:#fff;font-family:'Cairo',sans-serif;font-size:14px;outline:none}
.frow input:focus,.frow select:focus{border-color:var(--gold)}
.fgrid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fbtns{display:flex;gap:8px;margin-top:16px}
.fbtn{flex:1;padding:11px;border-radius:9px;border:none;font-family:'Cairo',sans-serif;font-size:14px;font-weight:700;cursor:pointer}
.fbtn.save{background:var(--gold);color:#111}
.fbtn.cancel{background:rgba(255,255,255,.08);color:var(--text)}

/* ===== added: paste-to-add-image modal + form preview ===== */
.imgmodal{background:#1e293b;border:1px solid var(--gold);border-radius:16px;width:100%;max-width:380px;padding:20px;margin:12vh auto;text-align:center}
.imgmodal .ftitle{margin-bottom:4px}
.imgmodal .sub{font-size:12px;color:var(--muted);margin-bottom:14px}
.dropzone{border:2px dashed var(--border);border-radius:12px;padding:28px 14px;cursor:pointer;outline:none;transition:border-color .15s;margin-bottom:14px}
.dropzone:focus,.dropzone.hover{border-color:var(--gold)}
.dropzone .dzicon{font-size:30px;margin-bottom:8px}
.dropzone .dztxt{font-size:12.5px;color:var(--muted);line-height:1.6}
.dropzone .dztxt b{color:var(--gold)}
.dropzone img.dzpreview{max-width:100%;max-height:160px;border-radius:8px;display:block;margin:0 auto}
.f_preview{max-width:100%;max-height:150px;border-radius:8px;display:none;margin-top:8px}
</style>
</head>
<body>

<div class="header">
  <div class="h-top">
    <div class="logo">AF <em>/ كتالوج المستودعات</em></div>
    <div class="pills">
      <span class="pill p1" id="s1">م1: —</span>
      <span class="pill p2" id="s2">م2: —</span>
      <span class="pill p3" id="s3">م3: —</span>
    </div>
  </div>
  <div class="sw">
    <span class="sic">🔍</span>
    <input class="si" id="si" type="text" placeholder="ابحث بالاسم، الكود، رمز الطرد، الباركود..." autocomplete="off" spellcheck="false">
    <button class="sc" id="sc" onclick="clrS()">✕</button>
  </div>
</div>

<div class="filters">
  <button class="fb on" onclick="setF('all',this)">الكل</button>
  <button class="fb" onclick="setF('w1',this)">📦 مستودع 1</button>
  <button class="fb" onclick="setF('w2',this)">📦 مستودع 2</button>
  <button class="fb" onclick="setF('w3',this)">📦 مستودع 3</button>
  <button class="fb" onclick="setF('img',this)">📷 عندهم صور</button>
  <button class="fb" onclick="setF('noimg',this)">🚫📷 بدون صورة</button>
  <button class="fb" onclick="setF('b10',this)">🔥 +10 صناديق</button>
  <button class="fb" onclick="setF('an',this)">AN</button>
  <button class="fb" onclick="setF('b',this)">B-</button>
  <button class="fb" onclick="setF('m',this)">M-</button>
</div>

<div class="rbar">
  <span id="rc">—</span>
  <button class="sort-btn" id="sortBtn" onclick="togSort()">↕ ترتيب بالصناديق</button>
</div>

<div class="gw"><div class="grid" id="grid"></div></div>

<div class="overlay" id="ov" onclick="clsM(event)">
  <div class="modal">
    <button class="medit" onclick="event.stopPropagation();openEditForm()">✏️ تعديل</button>
    <button class="medit" id="delImgBtn" style="background:rgba(239,68,68,.15);border-color:var(--red);color:var(--red);display:none" onclick="event.stopPropagation();deleteCurrentImage()">🗑️ حذف الصورة</button>
    <button class="mcl" onclick="clsM()">✕</button>
    <img class="mimg" id="mi" src="" alt="">
    <div class="mcode" id="mc"></div>
    <div class="mname" id="mn"></div>
    <div class="mqty" id="mq"></div>
    <div class="mdetails" id="md"></div>
  </div>
</div>

<input type="file" id="cardImgInput" accept="image/*" style="display:none">

<div class="overlay" id="ovImg">
  <div class="imgmodal">
    <div class="ftitle" id="imgModalTitle">إضافة صورة</div>
    <div class="sub">الصق الصورة (Ctrl+V) بعد نسخها، أو اختار ملف</div>
    <div class="dropzone" id="dropzone" tabindex="0" onclick="document.getElementById('cardImgInput').click()">
      <div id="dzInner"><div class="dzicon">📋</div><div class="dztxt">اضغط هون وبعدين <b>Ctrl+V</b><br>أو دوس لاختيار ملف من جهازك</div></div>
    </div>
    <div class="fbtns"><button class="fbtn cancel" onclick="closeImgModal()">إلغاء</button></div>
  </div>
</div>

<div class="overlay" id="ov2">
  <div class="fmodal">
    <div class="ftitle" id="formTitle">إضافة صنف جديد</div>
    <div class="frow"><label>اسم الصنف</label><input id="f_name" type="text"></div>
    <div class="fgrid2">
      <div class="frow"><label>كود المادة</label><input id="f_code" type="text"></div>
      <div class="frow"><label>رمز الطرد</label><input id="f_package" type="text"></div>
    </div>
    <div class="frow"><label>الباركود</label><input id="f_barcode" type="text"></div>
    <div class="fgrid2">
      <div class="frow"><label>إجمالي القطع</label><input id="f_qtypcs" type="number" min="0"></div>
      <div class="frow"><label>تعبئة الصندوق (قطعة)</label><input id="f_boxfill" type="number" min="1"></div>
    </div>
    <div class="fgrid2">
      <div class="frow"><label>عدد الصناديق</label><input id="f_qtyboxes" type="number" min="0" step="0.1"></div>
      <div class="frow"><label>المستودع</label>
        <select id="f_warehouse">
          <option value="مستودع 1">مستودع 1</option>
          <option value="مستودع 2">مستودع 2</option>
          <option value="مستودع 3">مستودع 3</option>
        </select>
      </div>
    </div>
    <div class="frow"><label>صورة الصنف (اختياري) — بالإمكان الصق Ctrl+V بعد ما تختار هاد الحقل</label><input id="f_image" type="file" accept="image/*"><img id="f_preview" class="f_preview"></div>
    <div class="fbtns">
      <button class="fbtn save" onclick="saveForm()">حفظ</button>
      <button class="fbtn cancel" onclick="clsForm()">إلغاء</button>
    </div>
  </div>
</div>

<script>
// ملاحظة أمنية: هذا الملف يعمل كـ HTML محلي بدون auth أو صلاحيات منفصلة.
// أي شخص يفتح الملف في المتصفح لديه صلاحية كاملة للتعديل/الحذف/التصدير/إضافة أصناف.
function esc(s){
  return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
let PRODUCTS = [];

const IMAGES={};

let DATA = [];
let filtered=[], curF='all', curQ='', sortByBoxes=false, page=0;
const PAGE=50;
let curCode=null;
let curItemKey=null;

async function loadProductsFromDB(){
  try{
    const response=await fetch('/api/products');
    if(!response.ok) throw new Error(`HTTP ${response.status}`);
    const data=await response.json();
    PRODUCTS = Array.isArray(data) ? data : [];
    DATA = PRODUCTS.map(p=>({...p}));
    run();
    updateStats();
  }catch(err){
    console.error('فشل تحميل الأصناف من قاعدة البيانات', err);
    PRODUCTS = [];
    DATA = [];
    run();
    updateStats();
  }
}

document.addEventListener('DOMContentLoaded', loadProductsFromDB);

function normalizeKeyPart(v){return String(v||'').trim().toLowerCase();}
function buildItemKey(p){
  return [p.warehouse, p.code, p.package_code, p.barcode]
    .map(normalizeKeyPart)
    .join('|');
}
function safeImageNamePart(v){
  return String(v||'').trim().replace(/[^a-z0-9\-_]+/gi,'-').replace(/-+/g,'-').replace(/^-|-$/g,'').toLowerCase();
}
function isValidImageSource(src){
  if(!src) return false;
  const s=String(src).trim();
  if(s.startsWith('data:image/')){
    return /^data:image\/[a-zA-Z0-9.+-]+;base64,[A-Za-z0-9+/=]+$/.test(s);
  }
  return true;
}
function buildImageFileName(p){
  const code=safeImageNamePart(p.code);
  const pkg=safeImageNamePart(p.package_code);
  if(pkg) return `${pkg}_${code}`;
  return code;
}
function getImageCandidates(p){
  const code=safeImageNamePart(p.code);
  const pkg=safeImageNamePart(p.package_code);
  const exts=['jpg','jpeg','png','webp','gif'];
  const stems=new Set();

  if(code && pkg){
    stems.add(`${pkg}_${code}`);
    stems.add(`${code}_${pkg}`);
    stems.add(`${pkg}-${code}`);
    stems.add(`${code}-${pkg}`);
  }

  if(code && !pkg){
    stems.add(code);
  }

  const candidates=[];
  for(const stem of stems){
    for(const ext of exts){ candidates.push(`images/${stem}.${ext}`); }
  }

  return candidates;
}
function findByKey(key){
  if(!key) return null;
  return DATA.find(d=>buildItemKey(d)===key);
}
function findByCode(code, packageCode='', warehouse='', barcode=''){
  if(!code) return null;
  const matches=DATA.filter(d=>String(d.code||'').trim()===String(code).trim());
  if(!matches.length) return null;

  const pkg=String(packageCode||'').trim();
  const wh=String(warehouse||'').trim();
  const br=String(barcode||'').trim();
  const exact=matches.find(d =>
    (!pkg || String(d.package_code||'').trim()===pkg) &&
    (!wh || String(d.warehouse||'').trim()===wh) &&
    (!br || String(d.barcode||'').trim()===br)
  );
  if(exact) return exact;

  if(pkg){
    const pkgMatches=matches.filter(d=>{
      const itemPkg=String(d.package_code||'').trim();
      return itemPkg && itemPkg!=='-' && itemPkg.toLowerCase()!=='null' && itemPkg===pkg;
    });
    return pkgMatches.length===1 ? pkgMatches[0] : null;
  }

  const noPackageMatches=matches.filter(d=>{
    const itemPkg=String(d.package_code||'').trim();
    return !itemPkg || itemPkg==='-' || itemPkg.toLowerCase()==='null';
  });
  if(noPackageMatches.length===1) return noPackageMatches[0];
  return null;
}

function getImg(p){
  const firstImage = Array.isArray(p.images) && p.images.length ? p.images[0] : '';
  if(firstImage && isValidImageSource(firstImage)) return firstImage;
  if(p.image_url && isValidImageSource(p.image_url)) return p.image_url;

  const candidates=getImageCandidates(p);
  for(const candidate of candidates){
    if(IMAGES[candidate]) return IMAGES[candidate];
  }

  const folderMatches=candidates
    .map(c=>c.replace(/^images\//,''))
    .find(name=>folderImageFiles.has(name.toLowerCase()));
  if(folderMatches){ return `images/${folderMatches}`; }

  const codeKey=safeImageNamePart(p.code);
  const pkgKey=safeImageNamePart(p.package_code);
  if(pkgKey && IMAGES[pkgKey]) return IMAGES[pkgKey];
  if(codeKey && IMAGES[codeKey]) return IMAGES[codeKey];
  return null;
}

function hasImage(p){
  const firstImage = Array.isArray(p.images) && p.images.length ? p.images[0] : '';
  if(firstImage && isValidImageSource(firstImage)) return true;
  if(p.image_url && isValidImageSource(p.image_url)) return true;
  const candidates=getImageCandidates(p);
  for(const candidate of candidates){
    if(IMAGES[candidate]) return true;
  }
  return candidates.some(c=>folderImageFiles.has(c.replace(/^images\//,'').toLowerCase()));
}

function validateProductDuplication(p){
  const code=String(p.code||'').trim();
  const wh=String(p.warehouse||'').trim();
  if(!code || !wh) return null;
  const dup=DATA.find(d=>String(d.code||'').trim()===code && String(d.warehouse||'').trim()===wh && String(d.package_code||'').trim()!==String(p.package_code||'').trim());
  return dup ? `تنبيه: يوجد صنف آخر بنفس الكود (${code}) في نفس المستودع لكن برمز طرد مختلف` : null;
}

function run(){
  const q=curQ.toLowerCase().trim();
  filtered=DATA.filter(p=>{
    if(q){
      const s=[p.name,p.code,p.package_code,p.barcode].join(' ').toLowerCase();
      if(!s.includes(q)) return false;
    }
    if(curF==='w1') return p.warehouse==='مستودع 1';
    if(curF==='w2') return p.warehouse==='مستودع 2';
    if(curF==='w3') return p.warehouse==='مستودع 3';
    if(curF==='img') return hasImage(p);
    if(curF==='noimg') return !hasImage(p);
    if(curF==='b10') return p.qty_boxes>=10;
    if(curF==='an') return (p.package_code||'').toUpperCase().startsWith('AN');
    if(curF==='b') return /^B[-\s]/i.test(p.package_code||'');
    if(curF==='m') return /^M[-\s]/i.test(p.package_code||'');
    return true;
  });
  if(sortByBoxes) filtered.sort((a,b)=>b.qty_boxes-a.qty_boxes);
  page=0;
  document.getElementById('rc').innerHTML=`<strong>${esc(filtered.length.toLocaleString('ar-EG'))}</strong> صنف`;
  render();
  updateStats();
}

// ===== ضغط الصور تلقائياً (تصغير الأبعاد + تحويل لـ JPEG بجودة عالية) =====
// الهدف: نفس الوضوح تقريباً للعين، بس حجم أصغر بعشرات المرات من صورة موبايل خام.
function compressImage(blob, maxDim=1000, quality=0.85){
  return new Promise((resolve,reject)=>{
    const url=URL.createObjectURL(blob);
    const img=new Image();
    img.onload=()=>{
      let w=img.width,h=img.height;
      if(w>maxDim||h>maxDim){
        if(w>h){h=Math.round(h*maxDim/w);w=maxDim;}else{w=Math.round(w*maxDim/h);h=maxDim;}
      }
      const canvas=document.createElement('canvas');
      canvas.width=w;canvas.height=h;
      canvas.getContext('2d').drawImage(img,0,0,w,h);
      URL.revokeObjectURL(url);
      canvas.toBlob(b=>{
        const r=new FileReader();
        r.onload=()=>resolve({dataUrl:r.result, blob:b});
        r.onerror=reject;
        r.readAsDataURL(b);
      },'image/jpeg',quality);
    };
    img.onerror=reject;
    img.src=url;
  });
}

/* ===================================================================
   إدارة مجلد الصور المحلي (File System Access API)
   الهدف: الصور تنحفظ كملفات منفصلة بمجلد images جنب ملف الـ HTML
   بدل ما تنضم base64 داخل الملف نفسه - هيك حجم الكتالوج بيضل خفيف
   =================================================================== */
let imagesDirectoryHandle=null;
let folderImageFiles=new Set();
const IMG_DB_NAME='catalogImagesDB', IMG_STORE='handles', IMG_HANDLE_KEY='imagesFolder';

function openHandleDB(){
  return new Promise((resolve,reject)=>{
    const req=indexedDB.open(IMG_DB_NAME,1);
    req.onupgradeneeded=()=>{ req.result.createObjectStore(IMG_STORE); };
    req.onsuccess=()=>resolve(req.result);
    req.onerror=()=>reject(req.error);
  });
}
async function saveHandleToDB(handle){
  const db=await openHandleDB();
  return new Promise((resolve,reject)=>{
    const tx=db.transaction(IMG_STORE,'readwrite');
    tx.objectStore(IMG_STORE).put(handle, IMG_HANDLE_KEY);
    tx.oncomplete=()=>resolve();
    tx.onerror=()=>reject(tx.error);
  });
}
async function loadHandleFromDB(){
  const db=await openHandleDB();
  return new Promise((resolve,reject)=>{
    const tx=db.transaction(IMG_STORE,'readonly');
    const req=tx.objectStore(IMG_STORE).get(IMG_HANDLE_KEY);
    req.onsuccess=()=>resolve(req.result||null);
    req.onerror=()=>reject(req.error);
  });
}

function setFolderStatus(connected){
  const el=document.getElementById('folder-status');
  if(!el) return;
  el.textContent=connected?'✅ مجلد الصور مربوط':'⚠️ مجلد الصور غير مربوط';
  el.style.color=connected?'#4ade80':'#ef4444';
}

async function refreshFolderImageIndex(){
  if(!imagesDirectoryHandle){ folderImageFiles.clear(); return; }
  try{
    folderImageFiles.clear();
    for await (const [name, handle] of imagesDirectoryHandle.entries()){
      if(handle?.kind==='file') folderImageFiles.add(name.toLowerCase());
    }
  }catch(err){ console.warn('لم نتمكن من قراءة محتويات المجلد', err); folderImageFiles.clear(); }
}

async function migrateLegacyImageToFile(p, skipConfirm=true){
  if(!imagesDirectoryHandle) return false;
  const current=(p.image_url||'').trim();
  if(!current || current.startsWith('images/')) return false;
  const isDataUrl=current.startsWith('data:image');
  const isHttpUrl=/^https?:\/\//i.test(current);
  if(!isDataUrl && !isHttpUrl) return false;

  try{
    const response=await fetch(current);
    if(!response.ok) throw new Error('bad response');
    const blob=await response.blob();
    const newPath=await saveImageToFolder(buildImageFileName(p), blob, skipConfirm);
    p.image_url=newPath;
    return true;
  }catch(err){
    console.warn('فشل تحويل الصورة القديمة إلى ملف', err);
    p.image_url='';
    return false;
  }
}

async function migrateLegacyImageUrls(){
  if(!imagesDirectoryHandle) return 0;
  let migrated=0;
  for(const p of DATA){
    if(!p.image_url) continue;
    if(p.image_url.startsWith('images/')) continue;
    if(await migrateLegacyImageToFile(p, true)) migrated++;
  }
  return migrated;
}

async function selectImagesFolder(){
  if(!('showDirectoryPicker' in window)){
    alert('هاد المتصفح ما بيدعم ربط المجلدات مباشرة (بتشتغل هاي الميزة على Chrome/Edge بس). الصور رح تنحفظ داخل ملف الكتالوج كالمعتاد.');
    return;
  }
  try{
    const handle=await window.showDirectoryPicker();
    const granted=await handle.requestPermission({mode:'readwrite'});
    if(granted!=='granted'){ alert('لازم توافق على صلاحية الكتابة حتى تنحفظ الصور بالمجلد.'); return; }
    imagesDirectoryHandle=handle;
    await refreshFolderImageIndex();
    await saveHandleToDB(handle);
    setFolderStatus(true);
    run();
  }catch(err){ console.warn('لم يتم اختيار المجلد', err); }
}

async function tryRestoreImagesFolder(){
  if(!('showDirectoryPicker' in window)){ setFolderStatus(false); return; }
  try{
    const saved=await loadHandleFromDB();
    if(!saved){ setFolderStatus(false); return; }
    let perm=await saved.queryPermission({mode:'readwrite'});
    if(perm!=='granted') perm=await saved.requestPermission({mode:'readwrite'});
    if(perm==='granted'){ imagesDirectoryHandle=saved; await refreshFolderImageIndex(); setFolderStatus(true); }
    else setFolderStatus(false);
  }catch(err){ console.warn('ما قدرنا نسترجع ربط المجلد تلقائياً', err); setFolderStatus(false); }
}

/* بتكتب الصورة كملف بمجلد images وبترجع المسار النسبي حتى نخزنه بـ image_url
   skipConfirm=true بتستخدم بالهجرة الجماعية حتى ما يطلع تأكيد لكل صورة عصورة */
async function saveImageToFolder(stem, blob, skipConfirm){
  const extRaw=(blob.type.split('/')[1]||'jpg').toLowerCase();
  const ext=extRaw==='jpeg'?'jpg':extRaw;
  const fileName=`${safeImageNamePart(stem)}.${ext}`;

  let exists=false;
  try{ await imagesDirectoryHandle.getFileHandle(fileName,{create:false}); exists=true; }catch{ exists=false; }

  if(exists && !skipConfirm){
    const ok=confirm(`في صورة موجودة مسبقاً للصنف ${stem}. استبدالها؟`);
    if(!ok) return `images/${fileName}`;
  }

  const fh=await imagesDirectoryHandle.getFileHandle(fileName,{create:true});
  const writable=await fh.createWritable();
  await writable.write(blob);
  await writable.close();
  return `images/${fileName}`;
}

/* هجرة لمرة وحدة: تفريغ كل الصور المضمّنة حالياً (base64 بحقل image_url لأي صنف،
   وكمان IMAGES القديمة المشتركة برمز الطرد) لملفات منفصلة باسم كود الصنف.
   بعدها IMAGES القديمة بتنفضّى تماماً وحجم الكتالوج بينزل بشكل كبير عند التصدير. */
async function migrateAllImagesToFiles(){
  if(!imagesDirectoryHandle){ alert('اربط مجلد الصور أولاً من زر 📁.'); return; }
  if(!confirm('رح ينقل كل الصور المضمّنة حالياً بالكتالوج لملفات منفصلة بمجلد images، وبيخفف حجم الكتالوج بشكل كبير عند التصدير. متابعة؟')) return;

  let migrated=0, failed=0;
  for(const p of DATA){
    let sourceDataUrl=null;
    if(p.image_url && p.image_url.startsWith('data:image')){
      sourceDataUrl=p.image_url;
    } else if(!p.image_url){
      const k=(p.package_code||'').toUpperCase();
      if(IMAGES[k]) sourceDataUrl=IMAGES[k];
    }
    if(!sourceDataUrl) continue;
    try{
      const res=await fetch(sourceDataUrl);
      const blob=await res.blob();
      p.image_url=await saveImageToFolder(buildImageFileName(p), blob, true);
      migrated++;
    }catch(err){ failed++; console.error('فشل نقل صورة الصنف '+p.code, err); }
  }

  for(const k in IMAGES) delete IMAGES[k]; // تفريغ الصور المشتركة القديمة بعد ما انسخت لملفات فردية

  run();
  alert(`تم نقل ${migrated} صورة لملفات منفصلة${failed?(' (فشل نقل '+failed+')'):''}. اضغط 💾 تصدير لحفظ نسخة الكتالوج الجديدة الخفيفة.`);
}

async function initializeImages(){
  await tryRestoreImagesFolder();
  const migrated=await migrateLegacyImageUrls();
  if(migrated) console.log(`تم تحويل ${migrated} صور قديمة إلى ملفات محلية`);
  run();
}
initializeImages();
bindGridEvents();

/* حذف صورة الصنف المفتوح حالياً بالنافذة المنبثقة - بيحذف المرجع من البيانات
   وكمان الملف الفعلي من مجلد images إذا كانت الصورة محفوظة محلياً والمجلد مربوط */
async function deleteCurrentImage(){
  const p=findByKey(curItemKey) || findByCode(curCode);
  if(!p){ return; }
  const path=p.image_url;
  if(!path){ alert('لا توجد صورة لهاد الصنف أساساً.'); return; }
  if(!confirm(`متأكد إنك بدك تحذف صورة الصنف "${p.name}"؟`)) return;

  if(path.startsWith('images/') && imagesDirectoryHandle){
    const fileName=path.replace('images/','');
    try{ await imagesDirectoryHandle.removeEntry(fileName); }
    catch(err){ console.warn('ما قدرنا نحذف الملف الفعلي من المجلد (ممكن يكون محذوف مسبقاً أو المجلد مش مربوط بنفس الجلسة)', err); }
  }

  p.image_url='';
  document.getElementById('mi').style.display='none';
  document.getElementById('delImgBtn').style.display='none';
  run();
}
</script>
